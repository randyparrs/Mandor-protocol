[profile.default]
src = "contracts"
out = "forge-out"
test = "test"
cache_path = "forge-cache"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
optimizer = true
# runs: 1 + via_ir (changed from runs: 200, no via_ir): v3's LP logic
# pushed MandateVault.sol's real runtime bytecode to 25,498 bytes, over
# the EIP-170 24,576-byte limit real EVM chains actually enforce at
# deployment (confirmed via `forge build --sizes`, not just a compiler
# warning). runs: 1 alone only reached 24,956 (still over); via_ir's more
# aggressive optimization pipeline was needed to reach 22,894, real margin
# under the limit. Slower to compile, an acceptable tradeoff for a
# testnet/hackathon deployment over raw compile speed. hardhat.config.ts
# mirrors this exactly, see that file's own comment.
optimizer_runs = 1
via_ir = true

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
